<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGuard - Sign In</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main class="auth-page">
    <section class="auth-card">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
            <div class="brand">
                <span style="font-size: 24px;">🛡️</span> FinGuard
            </div>
            <span style="font-size: 11px; padding: 4px 8px; border-radius: 6px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); color: #38bdf8;">
                v2.4 Secure
            </span>
        </div>

        <p style="margin: 0 0 20px 0; color: #94a3b8; font-size: 13px;">
            Sign in to access your financial risk & defense profile
        </p>

        <form id="loginForm" class="form">
            <div class="field">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="student@test.com"
                    value="student@test.com"
                    required
                >
            </div>

            <div class="field">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Password</label>
                    <a href="/pages/forgot-password.html" style="font-size: 11px; color: #38bdf8; font-weight: 500;">
                        Forgot Password?
                    </a>
                </div>
                <input
                    type="password"
                    name="password"
                    value="password123"
                    required
                >
            </div>

            <button type="submit" class="button" style="width: 100%;">
                Sign In
            </button>
        </form>

        <p id="msg" class="msg"></p>

        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 10px; text-align: center; font-size: 13px; color: #94a3b8;">
            <div>
                Don't have an account?
                <a href="/pages/signup.html" style="color: #38bdf8; font-weight: 600; margin-left: 4px;">
                    Create Account
                </a>
            </div>
            <div>
                <a href="/pages/home.html" style="color: #64748b; font-size: 12px;">
                    ← Back to Landing / Home
                </a>
            </div>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
</body>
</html>
