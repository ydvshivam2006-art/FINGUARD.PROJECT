<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Transactions</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/transaction.css"
    >

</head>

<body data-private="true">

<header class="top">

    <div class="brand">
        FinGuard
    </div>

    <nav class="nav">

        <a href="/index.html">Dashboard</a>
        <a href="/pages/defense-lab.html">Defense & UPI Lab</a>
        <a href="/pages/risk-check.html">Risk Check</a>
        <a href="/pages/scam-analyzer.html">Scam Analyzer</a>
        <a href="/pages/security_alert.html">Alerts</a>
        <a href="/pages/transactions.html">Transactions</a>
        <a href="/pages/budget.html">Budget</a>
        <a href="/pages/analytics.html">Analytics</a>
        <a href="/pages/profile.html">Profile</a>

    </nav>

</header>

<main class="container">

    <section class="hero">

        <h1>
            Transactions
        </h1>

        <form
            id="transactionForm"
            class="form"
        >

            <div class="field">

                <label>
                    Account
                </label>

                <select
                    id="account_id"
                    name="account_id"
                    required
                ></select>

            </div>

            <div class="field">

                <label>
                    Category
                </label>

                <select
                    id="category_id"
                    name="category_id"
                    required
                ></select>

            </div>

            <div class="field">

                <label>
                    Type
                </label>

                <select
                    name="transaction_type"
                >

                    <option value="EXPENSE">
                        Expense
                    </option>

                    <option value="INCOME">
                        Income
                    </option>

                </select>

            </div>

            <div class="field">

                <label>
                    Amount
                </label>

                <input
                    type="number"
                    name="amount"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>

            <div class="field">

                <label>
                    Description
                </label>

                <input
                    type="text"
                    name="description"
                >

            </div>

            <div class="field">

                <label>
                    Date
                </label>

                <input
                    type="date"
                    id="transaction_date"
                    name="transaction_date"
                    required
                >

            </div>

            <button
                class="button"
                type="submit"
            >
                Save Transaction
            </button>

        </form>

        <p
            id="msg"
            class="msg"
        ></p>

    </section>

    <section class="hero table-wrap">

        <h2>
            Transaction History
        </h2>

        <table class="table">

            <thead>

                <tr>

                    <th>
                        Date
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Description
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Amount
                    </th>

                </tr>

            </thead>

            <tbody id="rows"></tbody>

        </table>

    </section>

</main>

<script src="/js/auth.js"></script>
<script src="/js/main.js"></script>
<script src="/js/transaction.js"></script>

</body>

</html>
