<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Security Alerts</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/security_alert.css"
    >

</head>

<body data-private="true">

<header class="top">

    <div class="brand">
        FinGuard
    </div>

    <nav class="nav">

        <a href="/index.html">Dashboard</a>
        <a href="/pages/defense-lab.html">Defense & UPI Lab</a>
        <a href="/pages/risk-check.html">Risk Check</a>
        <a href="/pages/scam-analyzer.html">Scam Analyzer</a>
        <a href="/pages/security_alert.html">Alerts</a>
        <a href="/pages/transactions.html">Transactions</a>
        <a href="/pages/budget.html">Budget</a>
        <a href="/pages/analytics.html">Analytics</a>
        <a href="/pages/profile.html">Profile</a>

    </nav>

</header>

<main class="container">

    <section class="hero">

        <h1>
            Security Alerts
        </h1>

        <form
            id="alertForm"
            class="form"
        >

            <div class="field">

                <label>
                    Alert Type
                </label>

                <input
                    type="text"
                    name="alert_type"
                    required
                    placeholder="Suspicious transaction"
                >

            </div>

            <div class="field">

                <label>
                    Severity
                </label>

                <select name="severity">

                    <option value="LOW">
                        LOW
                    </option>

                    <option value="MEDIUM">
                        MEDIUM
                    </option>

                    <option value="HIGH">
                        HIGH
                    </option>

                </select>

            </div>

            <div class="field">

                <label>
                    Details
                </label>

                <textarea
                    name="details"
                    rows="5"
                ></textarea>

            </div>

            <button
                class="button"
                type="submit"
            >
                Create Alert
            </button>

        </form>

        <p
            id="msg"
            class="msg"
        ></p>

    </section>

    <section>

        <h2>
            Alert History
        </h2>

        <div
            id="alerts"
            class="grid"
        ></div>

    </section>

</main>

<script src="/js/auth.js"></script>
<script src="/js/main.js"></script>
<script src="/js/security_alert.js"></script>

</body>

</html>
