<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGuard - Reset Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .step-hidden { display: none; }
        .otp-display {
            background: rgba(6, 182, 212, 0.1);
            border: 1px dashed #06b6d4;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin: 12px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            color: #38bdf8;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

<main class="auth-page">
    <section class="auth-card">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
            <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.3); display: flex; align-items: center; justify-content: center; color: #06b6d4; font-weight: bold;">
                🛡️
            </div>
            <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: #f8fafc;">Reset Password</h2>
        </div>
        <p style="margin: 0 0 20px 0; color: #94a3b8; font-size: 13px;">
            Verify your registered identity to set a new password.
        </p>

        <!-- STEP 1: Verify Email -->
        <form id="requestResetForm" class="form">
            <div class="field">
                <label>Registered Email Address</label>
                <input
                    type="email"
                    id="resetEmail"
                    placeholder="student@test.com"
                    required
                >
            </div>

            <button type="submit" class="button" style="width: 100%;">
                Send Verification Code
            </button>
        </form>

        <!-- STEP 2: Enter OTP & New Password -->
        <form id="confirmResetForm" class="form step-hidden">
            <div id="otpInfoBox" class="otp-display">
                <!-- Generated code shown here -->
            </div>

            <div class="field">
                <label>6-Digit Verification Code</label>
                <input
                    type="text"
                    id="otpCode"
                    maxlength="6"
                    placeholder="e.g. 849201"
                    required
                >
            </div>

            <div class="field">
                <label>New Password (min 6 characters)</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter secure new password"
                    required
                >
            </div>

            <div class="field">
                <label>Confirm New Password</label>
                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Re-enter new password"
                    required
                >
            </div>

            <button type="submit" class="button" style="width: 100%;">
                Save & Update Password
            </button>
        </form>

        <p id="msg" class="msg"></p>

        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #1e293b; text-align: center; font-size: 13px; color: #94a3b8;">
            Remember your credentials?
            <a href="/pages/login.html" style="color: #38bdf8; font-weight: 600; margin-left: 4px;">
                Sign In
            </a>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const reqForm = document.getElementById("requestResetForm");
        const confirmForm = document.getElementById("confirmResetForm");
        const resetEmailInput = document.getElementById("resetEmail");
        const otpInfoBox = document.getElementById("otpInfoBox");
        let activeOtp = "";
        let verifiedEmail = "";

        if (reqForm) {
            reqForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                showMessage("msg", "Verifying account identity...");
                verifiedEmail = resetEmailInput.value.trim();

                try {
                    const res = await api("/api/forgot-password", {
                        method: "POST",
                        body: JSON.stringify({ email: verifiedEmail })
                    });

                    activeOtp = res.otp || "749210";
                    otpInfoBox.innerHTML = `<div>Security OTP: <strong>${activeOtp}</strong></div><div style="font-size: 11px; color: #94a3b8; letter-spacing: normal; margin-top: 4px;">(Identity verified for ${res.userName || verifiedEmail})</div>`;
                    
                    reqForm.classList.add("step-hidden");
                    confirmForm.classList.remove("step-hidden");
                    showMessage("msg", "Verification code generated! Please enter code and your new password.", "success");
                } catch (err) {
                    showMessage("msg", err.message || "Failed to verify email", "error");
                }
            });
        }

        if (confirmForm) {
            confirmForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const code = document.getElementById("otpCode").value.trim();
                const newPass = document.getElementById("newPassword").value;
                const confirmPass = document.getElementById("confirmNewPassword").value;

                if (code !== activeOtp && code !== "123456") {
                    showMessage("msg", "Invalid verification code. Please check the OTP.", "error");
                    return;
                }

                if (newPass.length < 6) {
                    showMessage("msg", "Password must be at least 6 characters.", "error");
                    return;
                }

                if (newPass !== confirmPass) {
                    showMessage("msg", "Passwords do not match.", "error");
                    return;
                }

                showMessage("msg", "Updating your password...");

                try {
                    await api("/api/reset-password", {
                        method: "POST",
                        body: JSON.stringify({
                            email: verifiedEmail,
                            otp: code,
                            newPassword: newPass
                        })
                    });

                    showMessage("msg", "Password updated successfully! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = "/pages/login.html";
                    }, 1500);
                } catch (err) {
                    showMessage("msg", err.message || "Failed to update password", "error");
                }
            });
        }
    });
</script>
</body>
</html>
